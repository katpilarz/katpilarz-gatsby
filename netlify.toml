# Netlify build configuration.
#
# Previously this lived only in the Netlify dashboard, which meant nothing in
# the repository described how the site is actually built — and no way to tell,
# from here, why a deploy had shipped something other than what is on main.
# Settings in this file take precedence over the dashboard.

[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  # Matches .nvmrc and the `engines` field in package.json. Netlify reads
  # .nvmrc on its own, but stating it here keeps the two from drifting.
  NODE_VERSION = "20"

  # The Sanity project ID, dataset and any SANITY_READ_TOKEN are set in the
  # Netlify dashboard (Site configuration > Environment variables), not here,
  # so they stay out of the public repository. The build fails without the
  # project ID and dataset.
